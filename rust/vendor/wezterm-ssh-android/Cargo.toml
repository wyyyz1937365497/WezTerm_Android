[package]
name = "wezterm-ssh"
version = "0.4.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
repository = "https://github.com/wezterm/wezterm"
description = "WezTerm SSH transport with a narrow Android config-isolation patch"
license = "MIT"
publish = false

[features]
default = ["libssh-rs", "ssh2"]
vendored-openssl = ["ssh2/vendored-openssl", "libssh-rs/vendored-openssl"]
vendored-openssl-ssh2 = ["ssh2/vendored-openssl"]
vendored-openssl-libssh-rs = ["libssh-rs/vendored-openssl"]

[dependencies]
anyhow = "1.0"
base64 = { version = "0.22", default-features = false, features = ["std"] }
bitflags = "1.3"
camino = "1.0"
dirs-next = "2.0"
filedescriptor = { version = "0.8.3", git = "https://github.com/wezterm/wezterm.git", rev = "d2f3f05b38f26a872f4b0bfbb3d2eaa7bdfc1b0b" }
filenamegen = "0.2.6"
gethostname = "0.5"
hex = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
libssh-rs = { version = "0.3.8", features = ["vendored"], optional = true }
log = "0.4"
portable-pty = { git = "https://github.com/wezterm/wezterm.git", rev = "d2f3f05b38f26a872f4b0bfbb3d2eaa7bdfc1b0b" }
regex = "1"
sha2 = "0.10"
smol = "2.0"
socket2 = "0.5"
ssh2 = { version = "0.9.3", features = ["openssl-on-win32"], optional = true }
thiserror = "1.0"
wezterm-uds = { git = "https://github.com/wezterm/wezterm.git", rev = "d2f3f05b38f26a872f4b0bfbb3d2eaa7bdfc1b0b" }

# This is intentionally retained because upstream uses it to unify the
# openssl-sys feature selection across SSH backends.
async_ossl = { git = "https://github.com/wezterm/wezterm.git", rev = "d2f3f05b38f26a872f4b0bfbb3d2eaa7bdfc1b0b" }

[target.'cfg(unix)'.dependencies]
passfd = "0.1.6"
